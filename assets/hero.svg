<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070D"/>
      <stop offset="0.52" stop-color="#08111C"/>
      <stop offset="1" stop-color="#090518"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="80" x2="1010" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#61EAFB"/>
      <stop offset="0.5" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#C56CFF"/>
      <animate attributeName="x1" values="120;260;120" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1080;940;1080" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop stop-color="#61EAFB" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#61EAFB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#78DFFF" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="418" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="1050" cy="55" r="330" fill="url(#orb)" opacity="0.45">
      <animate attributeName="opacity" values="0.24;0.55;0.24" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="125" cy="395" r="270" fill="url(#orb)" opacity="0.2">
      <animate attributeName="opacity" values="0.14;0.36;0.14" dur="6s" repeatCount="indefinite"/>
    </circle>

    <g opacity="0.65">
      <path d="M75 91L214 54L332 114L462 69L580 125" stroke="url(#accent)" stroke-opacity="0.28"/>
      <path d="M700 314L817 259L944 309L1108 241" stroke="url(#accent)" stroke-opacity="0.28"/>
      <path d="M1028 76L943 151L1085 201L1144 119" stroke="url(#accent)" stroke-opacity="0.22"/>
      <g fill="#61EAFB" filter="url(#glow)">
        <circle cx="75" cy="91" r="3"><animate attributeName="r" values="2;5;2" dur="2.8s" repeatCount="indefinite"/></circle>
        <circle cx="214" cy="54" r="3"><animate attributeName="r" values="4;2;4" dur="3.2s" repeatCount="indefinite"/></circle>
        <circle cx="332" cy="114" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
        <circle cx="462" cy="69" r="3"><animate attributeName="r" values="2;4;2" dur="3.6s" repeatCount="indefinite"/></circle>
        <circle cx="580" cy="125" r="3"/>
        <circle cx="700" cy="314" r="3"/>
        <circle cx="817" cy="259" r="3"><animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
        <circle cx="944" cy="309" r="3"><animate attributeName="r" values="2;5;2" dur="3s" repeatCount="indefinite"/></circle>
        <circle cx="1108" cy="241" r="3"/>
      </g>
    </g>

    <g transform="translate(1030 112)">
      <circle r="64" stroke="#61EAFB" stroke-opacity="0.16"/>
      <circle r="45" stroke="#8D7CFF" stroke-opacity="0.26" stroke-dasharray="8 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle r="25" stroke="#C56CFF" stroke-opacity="0.48" stroke-dasharray="3 6">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#61EAFB" filter="url(#glow)">
        <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="58" y="52" width="188" height="34" rx="17" fill="#0B1723" stroke="#61EAFB" stroke-opacity="0.35"/>
    <circle cx="79" cy="69" r="5" fill="#55F5A8" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="74" fill="#9CEBFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.7">SİSTEMLER AKTİF</text>

    <text x="58" y="180" fill="#A8B7C8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">MUHAMMET MUSTAFA KARA</text>
    <text x="54" y="244" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="800" letter-spacing="-2">HIZLI. GÜVENİLİR. MERAKLI.</text>
    <text x="58" y="286" fill="#D8E2EE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="2">YAZILIM MÜHENDİSİ  ·  WEB3 SİSTEMLERİ  ·  UYGULAMALI YAPAY ZEKÂ</text>

    <g transform="translate(58 327)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">
      <rect width="210" height="42" rx="10" fill="#0B131D" stroke="#61EAFB" stroke-opacity="0.22"/>
      <text x="17" y="26" fill="#8FA2B7">DÜŞÜK GECİKME</text>
      <rect x="224" width="194" height="42" rx="10" fill="#0B131D" stroke="#778CFF" stroke-opacity="0.24"/>
      <text x="241" y="26" fill="#8FA2B7">ZİNCİR ÜSTÜ VERİ</text>
      <rect x="432" width="170" height="42" rx="10" fill="#0B131D" stroke="#C56CFF" stroke-opacity="0.24"/>
      <text x="449" y="26" fill="#8FA2B7">YAPAY ZEKÂ</text>
    </g>

    <rect x="0" y="0" width="2" height="420" fill="#61EAFB" opacity="0.8" filter="url(#glow)">
      <animate attributeName="x" values="-5;1205" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="28" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="2"/>
</svg>
